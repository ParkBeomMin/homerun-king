<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f2a4a">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="홈런왕">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>홈런왕 키우기 - 방치형 홈런 게임</title>
<meta name="description" content="켜두기만 해도 홈런이 터진다! 방망이를 사고, 강화하고, 바꿔가며 더 먼 구장으로. 방치형 홈런 게임 홈런왕 키우기.">
<meta property="og:type" content="website">
<meta property="og:title" content="홈런왕 키우기">
<meta property="og:description" content="방망이를 사고, 강화하고, 바꿔서 장외 홈런까지. 켜두기만 해도 성장하는 방치형 홈런 게임">
<meta property="og:image" content="https://parkbeommin.github.io/homerun-king/og.jpg">
<meta property="og:url" content="https://parkbeommin.github.io/homerun-king/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/ui/icon-192.png">
<link rel="apple-touch-icon" href="assets/ui/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f2a4a;--panel:#16365c;--card:#1e4572;--line:#2c5a8f;--txt:#f4f8ff;--sub:#a9c2e0;--gold:#ffd84a;--gem:#6ff0ff;--red:#ff5a5a;--green:#4cd97b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#071629;color:var(--txt);font-family:'Jua',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{max-width:480px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative}
#hud{padding:8px 10px 6px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(#0b2140,#123257);border-bottom:2px solid #0a1d36}
.row{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:5px;background:#0a1d36;border:2px solid #24507f;border-radius:20px;padding:3px 10px 3px 4px;font-size:16px;min-width:0}
.pill .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.coin .ic{background:radial-gradient(circle at 35% 35%,#fff3a6,#f2b900 60%,#a87a00)}
.gem .ic{background:radial-gradient(circle at 35% 35%,#e5ffff,#38d6f0 60%,#137f9e)}
.tix .ic{background:radial-gradient(circle at 35% 35%,#e6ffe9,#4cd97b 60%,#1e7a3e)}
#coins{font-size:20px;color:var(--gold)}
#stadBar{margin-top:6px;font-size:13px;color:var(--sub)}
#stadName{color:#fff;font-size:15px}
.bar{flex:1;height:10px;background:#0a1d36;border-radius:6px;overflow:hidden;border:1px solid #24507f}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#ffd84a);width:0%}
#fieldWrap{position:relative;flex:0 0 auto;height:39vh;height:39dvh;min-height:230px;max-height:420px;overflow:hidden;cursor:pointer}
#field{width:100%;height:100%;display:block}
#tapHint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 12px;border-radius:14px;font-size:14px;white-space:nowrap;pointer-events:none;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
#ctrl{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0b2140;border-top:2px solid #0a1d36;border-bottom:2px solid #0a1d36;font-size:13px;color:var(--sub)}
.tog{border:none;border-radius:14px;padding:6px 12px;font-family:inherit;font-size:14px;color:#fff;background:#3a4a60;cursor:pointer}
.tog.on{background:linear-gradient(#3ccf6e,#22a052)}
#cps{flex:1;text-align:right}
#feverTag{display:none;background:linear-gradient(90deg,#ff6a00,#ffcc00);color:#3a1600;border-radius:10px;padding:2px 8px;font-size:13px}
#panel{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}
#tabs{display:flex;background:#0b2140;border-top:2px solid #0a1d36;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;border:none;background:none;color:var(--sub);font-family:inherit;font-size:14px;padding:8px 0 9px;cursor:pointer;position:relative}
#tabs button b{display:block;font-size:20px;line-height:1.1}
#tabs button.on{color:#fff;background:linear-gradient(#1b4170,#0b2140)}
#tabs button .dot{position:absolute;top:6px;right:28%;width:9px;height:9px;border-radius:50%;background:var(--red);display:none}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.stat{display:flex;align-items:center;gap:10px}
.stat .si{width:42px;height:42px;border-radius:12px;background:#0f2a4a;display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.stat .sm{flex:1;min-width:0}
.stat .sn{font-size:16px}
.stat .sd{font-size:12px;color:var(--sub)}
.btn{border:none;border-radius:12px;padding:8px 12px;font-family:inherit;font-size:15px;color:#2b1a00;background:linear-gradient(#ffe57a,#f5b700);box-shadow:0 3px 0 #a87a00;cursor:pointer;min-width:84px}
.btn{transition:transform .06s,filter .06s}
.btn:active{transform:translateY(3px) scale(.95);box-shadow:0 0 0 #a87a00;filter:brightness(1.12)}
.btn.blue:active{box-shadow:0 0 0 #1a5596}.btn.green:active{box-shadow:0 0 0 #146b36}.btn.red:active{box-shadow:0 0 0 #8f2020}
.btn.pop{animation:btnPop .38s ease-out}
@keyframes btnPop{0%{transform:scale(.9)}45%{transform:scale(1.12);filter:brightness(1.35)}100%{transform:scale(1)}}
.card.glow{animation:cardGlow .5s ease-out}
@keyframes cardGlow{0%{box-shadow:0 0 0 0 rgba(255,216,74,.9)}100%{box-shadow:0 0 0 12px rgba(255,216,74,0)}}
#uifx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#uifx .ft{position:absolute;transform:translate(-50%,-50%);font-size:20px;color:#ffe14d;text-shadow:0 2px 0 #000,0 0 6px rgba(0,0,0,.6);white-space:nowrap;animation:ftUp 1s ease-out forwards}
@keyframes ftUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
#uifx .sp{position:absolute;width:8px;height:8px;border-radius:50%;box-shadow:0 0 6px currentColor;animation:spOut .7s ease-out forwards}
@keyframes spOut{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.btn[disabled]{filter:grayscale(1) brightness(.7);cursor:default}
.btn.blue{color:#fff;background:linear-gradient(#5bb8ff,#2b7fd6);box-shadow:0 3px 0 #1a5596}
.btn.green{color:#fff;background:linear-gradient(#4fe08a,#22a052);box-shadow:0 3px 0 #146b36}
.btn.red{color:#fff;background:linear-gradient(#ff7a7a,#d63b3b);box-shadow:0 3px 0 #8f2020}
.btn.gray{color:#fff;background:#4a5a72;box-shadow:0 3px 0 #2a3546}
.btn.big{font-size:18px;padding:11px 16px;width:100%}
.btn.sm{font-size:13px;padding:5px 8px;min-width:0}
.cost{font-size:13px;display:block}
.h{font-size:15px;color:var(--sub);margin:6px 2px 8px;display:flex;align-items:center;gap:6px}
.h .r{margin-left:auto}
.grade{display:inline-block;border-radius:8px;padding:1px 7px;font-size:12px;color:#1b1b1b}
.eq{display:flex;gap:10px;align-items:center}
.eq .bimg{width:150px;flex:0 0 auto}
.bimg svg{width:100%;height:auto;display:block}
.small{font-size:12px;color:var(--sub)}
.inv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bc{background:#173a63;border:2px solid var(--line);border-radius:12px;padding:7px;font-size:13px;position:relative}
.bc.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.bc .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc .act{display:flex;gap:5px;margin-top:5px}
.bc .act .btn{flex:1}
.enhRow{display:flex;justify-content:space-between;font-size:14px;margin:4px 0}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;margin:6px 0}
.chk input{width:18px;height:18px}
.shopi{display:flex;align-items:center;gap:10px}
.shopi .pic{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:28px;background:#0f2a4a;flex:0 0 auto}
.odds{font-size:12px;color:var(--sub);margin-top:4px}
.st{display:flex;align-items:center;gap:10px}
.st .num{width:30px;height:30px;border-radius:50%;background:#0f2a4a;display:grid;place-items:center;flex:0 0 auto}
.st.lock{opacity:.5}
.st.cur{border-color:var(--gold)}
#modal{position:fixed;inset:0;background:rgba(3,10,22,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.hidden{display:none}
.mbox{max-height:88vh;max-height:88dvh;overflow-y:auto;background:linear-gradient(#1f4878,#15345a);border:3px solid #3d74b3;border-radius:18px;padding:18px;width:100%;max-width:360px;text-align:center;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.mbox h2{margin:0 0 8px;font-weight:normal;font-size:24px}
.mbox p{margin:6px 0;color:var(--sub);font-size:15px}
.mbox .bimg{width:220px;margin:10px auto}
.shake{animation:shk .08s linear infinite}
@keyframes shk{25%{transform:translate(-3px,1px) rotate(-2deg)}75%{transform:translate(3px,-1px) rotate(2deg)}}
.res{font-size:30px;margin:6px 0}
.glow{animation:glw 1s ease-in-out infinite alternate}
@keyframes glw{to{filter:drop-shadow(0 0 12px #fff)}}
#toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);border-radius:12px;padding:6px 12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:5}
#toast.show{opacity:1}
.mbtns{display:flex;gap:8px;margin-top:12px}
.mbtns .btn{flex:1}
.ir{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;text-align:left}
.ir span{color:var(--sub)}
.ir b{font-weight:normal;color:#fff;text-align:right}
.ir b.hl{color:var(--gold)}
.isec{font-size:12px;color:#7fb2ea;text-align:left;margin:12px 2px 2px}
.itips{text-align:left;margin:4px 0 0;padding-left:18px;color:var(--sub);font-size:13px;line-height:1.6}
.mbox.scroll{max-height:86vh;overflow-y:auto}
#hapLbl{position:absolute;inset:0;z-index:2;display:none;-webkit-touch-callout:none}
#hapSw{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
#title{position:fixed;inset:0;margin:0 auto;max-width:480px;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12vh 20px 9vh;background:linear-gradient(180deg,rgba(7,22,41,.15) 0%,rgba(7,22,41,0) 40%,rgba(7,22,41,.85) 100%),url(assets/ui/key_art.webp) center/cover no-repeat,linear-gradient(#1a4f8f,#0b2140);transition:opacity .35s;cursor:pointer}
#title.out{opacity:0}
.tlogo{text-align:center}
#tEmblem{width:120px;height:120px;border-radius:28px;box-shadow:0 6px 18px rgba(0,0,0,.45);display:block;margin:0 auto 10px}
#title h1{margin:0;font-weight:normal;font-size:62px;line-height:1.02;color:#ffd84a;-webkit-text-stroke:3px #4a2400;paint-order:stroke fill;text-shadow:0 6px 0 #8a4a00,0 10px 18px rgba(0,0,0,.5)}
#title h1 span{color:#fff;-webkit-text-stroke:3px #0b2a55;text-shadow:0 6px 0 #123e7a,0 10px 18px rgba(0,0,0,.5)}
.ttap{font-size:20px;color:#fff;text-shadow:0 2px 4px #000;animation:tp 1.1s ease-in-out infinite}
@keyframes tp{50%{opacity:.35}}
.tver{font-size:11px;color:rgba(255,255,255,.6);position:absolute;bottom:max(10px,env(safe-area-inset-bottom))}
.bart{position:relative;display:block}
.bart img{width:100%;height:auto;display:block;-webkit-user-drag:none}
.bart i{position:absolute;right:20%;top:50%;transform:translateY(-50%);font-style:normal;font-size:14px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000}
.bart.aura img{filter:drop-shadow(0 0 6px var(--gc)) drop-shadow(0 0 2px var(--gc))}
.stat .si img{width:34px;height:34px;object-fit:contain}
.mini img{width:22px;height:22px;object-fit:contain;vertical-align:middle}
.shopi .pic img{width:46px;height:46px;object-fit:contain}
.attrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.attd{background:#0f2a4a;border:2px solid #24507f;border-radius:10px;padding:5px 2px;text-align:center;font-size:10px;color:var(--sub);position:relative;min-height:58px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.attd b{font-weight:normal;color:#fff;font-size:12px}
.attd.now{border-color:var(--gold);box-shadow:0 0 8px rgba(255,216,74,.5)}
.attd.got{opacity:.55}
.attd i{position:absolute;top:2px;right:4px;font-style:normal;color:var(--green);font-size:12px}
.mis{display:flex;align-items:center;gap:10px}
#tabs button{font-size:13px}
#wkTag{display:none;background:linear-gradient(90deg,#7b5cff,#ff6ad5);color:#fff;border-radius:10px;padding:2px 8px;font-size:12px}
#guide{position:absolute;left:8px;right:8px;bottom:8px;z-index:6;display:none;align-items:center;gap:8px;background:rgba(255,216,74,.96);color:#2b1a00;border-radius:12px;padding:7px 10px;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.35);pointer-events:auto}
#guide span{flex:1}
#guide button{border:none;background:rgba(0,0,0,.15);color:#2b1a00;border-radius:8px;padding:3px 7px;font-family:inherit;font-size:11px}
.gmark{animation:gm 1s ease-in-out infinite;position:relative;z-index:3}
@keyframes gm{50%{box-shadow:0 0 0 4px #ffd84a,0 0 18px #ffd84a}}
.dex{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.dx{background:#0f2a4a;border-radius:8px;padding:4px 2px;filter:grayscale(1) brightness(.35)}
.dx.got{filter:none}
.ir.me{background:rgba(255,216,74,.15);border-radius:8px}
#app.swap #hud{order:0}
#app.swap #panel{order:1}
#app.swap #tabs{order:2;padding-bottom:0;border-bottom:2px solid #0a1d36}
#app.swap #ctrl{order:3}
#app.swap #fieldWrap{order:4;margin-bottom:env(safe-area-inset-bottom)}
#app.swap{background:#071629}
#swapBtn{padding:6px 10px;font-size:16px;line-height:1;background:#2b5a8f}
#adbar{order:9;flex:0 0 auto;display:flex;justify-content:center;align-items:center;min-height:calc(50px + env(safe-area-inset-bottom));background:#050f1e;padding-bottom:env(safe-area-inset-bottom)}
#goldBall{position:absolute;right:-60px;width:44px;height:44px;z-index:6;cursor:pointer;animation:goldFly 9s linear forwards;touch-action:none}
#goldBall i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c2,#ffd84a 40%,#e09a10 75%,#9a5a00);box-shadow:0 0 18px 6px rgba(255,216,74,.75);animation:goldBob .7s ease-in-out infinite alternate}
#goldBall b{position:absolute;right:-10px;top:-12px;font-size:20px;animation:goldBob .5s ease-in-out infinite alternate-reverse}
@keyframes goldFly{from{transform:translateX(0)}to{transform:translateX(calc(-100vw - 120px))}}
@keyframes goldBob{from{translate:0 -6px}to{translate:0 6px}}
html.in-app body.ad-on #tabs{padding-bottom:0}
html.in-app body.ad-on #app.swap #fieldWrap{margin-bottom:0}
html.in-app #adbar{padding-bottom:max(env(safe-area-inset-bottom),var(--safe-area-inset-bottom,0px));min-height:calc(50px + max(env(safe-area-inset-bottom),var(--safe-area-inset-bottom,0px)))}
.wrew{margin-top:6px;background:rgba(255,255,255,.05);border-radius:10px;padding:6px 8px}.wrew .ir{font-size:13px;padding:3px 0}
#adbar .ad-ph{width:320px;height:50px;display:flex;align-items:center;justify-content:center;border:1px dashed #3d5f8f;color:#6f8bb3;font-size:12px}
body.ad-on #tabs{padding-bottom:0}
body.ad-on #app.swap #fieldWrap{margin-bottom:0}
#boostBtn{padding:6px 8px;font-size:12px;background:#2a8a4a}
#boostBtn:disabled{opacity:1;background:#ff8a1f;color:#3a1600}
.tpromo{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom)) + 22px);width:max-content;max-width:92%;font-size:13px;color:#4dfff0;background:rgba(0,0,0,.45);border-radius:12px;padding:5px 12px}
.apppromo{border:2px solid #4dfff0}
html.in-app #hud{padding-top:max(8px,env(safe-area-inset-top),var(--safe-area-inset-top,0px))}
html.in-app #tabs{padding-bottom:max(env(safe-area-inset-bottom),var(--safe-area-inset-bottom,0px))}
html.in-app #app.swap #tabs{padding-bottom:0}
html.in-app #app.swap #fieldWrap{margin-bottom:max(env(safe-area-inset-bottom),var(--safe-area-inset-bottom,0px))}
html[lang=ja] #title h1{font-size:44px;white-space:nowrap}
html[lang=ja] #title h1 span{font-size:52px}
/* 홈런 더비 전용 화면 */
#derbyLobby{position:fixed;inset:0;margin:0 auto;max-width:480px;z-index:40;display:none;flex-direction:column;background:radial-gradient(circle at 50% 0%,#2a5d9a 0%,#0b2140 55%,#071629 100%);padding:max(14px,env(safe-area-inset-top),var(--safe-area-inset-top,0px)) 14px max(14px,env(safe-area-inset-bottom),var(--safe-area-inset-bottom,0px));overflow-y:auto}
#derbyLobby.on{display:flex}
#derbyLobby .dtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
#derbyLobby h2{margin:0;font-weight:normal;font-size:30px;color:#ffd84a;-webkit-text-stroke:2px #4a2400;paint-order:stroke fill;text-shadow:0 4px 0 #8a4a00}
#derbyLobby .dsub{color:#bcd3f5;font-size:13px;margin-bottom:10px}
#derbyLobby .dstat{display:flex;gap:8px;margin:6px 0 12px}
#derbyLobby .dstat div{flex:1;background:rgba(10,29,54,.8);border:2px solid #2b5a8f;border-radius:12px;padding:8px;text-align:center;font-size:12px;color:#9fb4d6}
#derbyLobby .dstat b{display:block;font-size:20px;color:#fff;font-weight:normal}
#derbyLobby .drank{flex:1;min-height:180px;background:rgba(10,29,54,.8);border:2px solid #2b5a8f;border-radius:14px;padding:10px;overflow-y:auto}
#derbyLobby .drank .ir{display:flex;justify-content:space-between;padding:6px 8px;font-size:15px;border-bottom:1px solid rgba(61,116,179,.3)}
#derbyLobby .drank .ir.me{background:rgba(255,216,74,.15);border-radius:8px}
#derbyLobby .drank .ir:nth-child(1) span{color:#ffd84a}#derbyLobby .drank .ir:nth-child(2) span{color:#dfe8f5}#derbyLobby .drank .ir:nth-child(3) span{color:#ffb070}
#derbyLobby .dbtns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
body.derby-on #ctrl,body.derby-on #panel,body.derby-on #tabs{display:none!important}
body.derby-on #fieldWrap{flex:1 1 auto;height:auto;max-height:none}
body.derby-on #tapHint,body.derby-on #guide{display:none!important}
#derbyHud{display:none;position:absolute;left:0;right:0;bottom:0;z-index:3;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(rgba(5,15,35,0),rgba(5,15,35,.85) 40%);pointer-events:none}
body.derby-on #derbyHud{display:block}
#derbyHud .row1{display:flex;align-items:flex-end;justify-content:space-between}
#derbyHud .hrbig{font-size:40px;color:#ffd84a;-webkit-text-stroke:2px #4a2400;paint-order:stroke fill;line-height:1}
#derbyHud .hrbig small{font-size:16px;color:#fff;-webkit-text-stroke:0}
#derbyHud .info{text-align:right;color:#dfe8f5;font-size:13px}
#derbyHud .dots{display:flex;gap:5px;margin-top:6px}
#derbyHud .dots i{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.25)}

<body>
<div id="app">
  <header id="hud">
    <div class="row">
      <div class="pill coin"><span class="ic">₩</span><span id="coins">0</span></div>
      <div class="pill gem"><span class="ic">◆</span><span id="gems">0</span></div>
      <div class="pill tix" title="강화 보호권"><span class="ic">🛡</span><span id="tix">0</span></div>
      <span id="feverTag">FEVER x2</span>
      <span id="wkTag">주말 코인 x2</span>
    </div>
    <div id="stadBar" class="row">
      <span id="stadName">동네 공터</span>
      <span id="fenceTxt">펜스 45m</span>
      <div class="bar"><i id="stadProg"></i></div>
      <span id="stadHR">0/10</span>
    </div>
  </header>
  <div id="fieldWrap">
    <canvas id="field"></canvas>
    <label id="hapLbl" for="hapSw" aria-hidden="true"></label><input type="checkbox" switch id="hapSw" tabindex="-1" aria-hidden="true">
    <div id="tapHint">존 안의 공이 오면 탭! 볼은 참으세요</div>
    <div id="toast"></div>
    <div id="guide"><span id="guideTxt"></span><button id="guideSkip">건너뛰기</button></div>
    <div id="derbyHud"><button id="derbyQuit">그만하기</button><div class="row1"><div class="hrbig" id="dHr">0<small> 홈런</small></div><div class="info"><div id="dLeft">10구 남음</div><div id="dBest">최장 -</div></div></div><div class="dots" id="dDots"></div></div>
  </div>
  <div id="ctrl">
    <button id="autoBtn" class="tog on">자동 타격 ON</button>
    <button id="swapBtn" class="tog" title="타석 화면 위/아래 바꾸기">⇅</button>
    <button id="boostBtn" class="tog" style="display:none">📺 5분 x2</button>
    <span id="cps">초당 0</span>
  </div>
  <section id="panel"></section>
  <nav id="tabs">
    <button data-t="batter" class="on"><b>🧢</b>타자<span class="dot"></span></button>
    <button data-t="bats"><b>🏏</b>방망이<span class="dot"></span></button>
    <button data-t="shop"><b>🛒</b>상점<span class="dot"></span></button>
    <button data-t="stadium"><b>🏟</b>구장<span class="dot"></span></button>
    <button data-t="mission"><b>📋</b>미션<span class="dot"></span></button>
  </nav>
</div>
<div id="title"><div class="tlogo"><img id="tEmblem" src="assets/ui/emblem.webp" alt="" onerror="this.style.display='none'"><h1>홈런왕<br><span>키우기</span></h1></div><div class="ttap">화면을 탭해서 시작</div><div class="tver" id="tVer"></div></div>
<div id="derbyLobby"></div>
<div id="modal" class="hidden"></div>
